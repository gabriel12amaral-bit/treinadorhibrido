<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Desenvolvimento Halteres">
  <defs>
    <style>
      .bg{fill:#09090b}.panel{fill:#15151a;stroke:#2b2b33;stroke-width:3}.line{stroke:#e7e7ec;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;fill:none}.joint{fill:#9cff57}.accent{stroke:#9cff57;stroke-width:10;stroke-linecap:round}.muted{fill:#9ca3af}.title{font:700 34px Arial, sans-serif;fill:#fff}.cue{font:500 18px Arial, sans-serif;fill:#9ca3af}.tag{font:700 14px Arial, sans-serif;fill:#9cff57;letter-spacing:2px}.plate{fill:#2a2a31;stroke:#9cff57;stroke-width:4}.bench{fill:#2b2b33}.floor{stroke:#363640;stroke-width:6}.moving{animation:move 1.35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}.moving2{animation:move2 1.35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes move{from{transform:translateY(18px)}to{transform:translateY(-18px)}}@keyframes move2{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
    </style>
  </defs>
  <rect class="bg" width="640" height="420" rx="28"/>
  <rect class="panel" x="24" y="24" width="592" height="372" rx="24"/>
  <text x="48" y="70" class="tag">DEMO EXERCICIO</text>
  <text x="48" y="112" class="title">Desenvolvimento Halteres</text>
  <text x="48" y="142" class="cue">Core firme</text>
  <line class="floor" x1="74" y1="340" x2="566" y2="340"/>
  <circle class="joint" cx="320" cy="205" r="23"/><line class="line" x1="320" y1="230" x2="320" y2="310"/><g class="moving"><line class="line" x1="270" y1="210" x2="305" y2="250"/><line class="line" x1="370" y1="210" x2="335" y2="250"/><circle class="plate" cx="270" cy="190" r="15"/><circle class="plate" cx="370" cy="190" r="15"/></g><line class="line" x1="320" y1="310" x2="280" y2="340"/><line class="line" x1="320" y1="310" x2="360" y2="340"/>
</svg>